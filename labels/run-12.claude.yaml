- case_id: tuple_vs_list
  repeat: 0
  question: |
    In Python, when would you use a tuple instead of a list? Give one short example.
  rubric: |
    Says tuples can't be changed after creation (immutable) and lists can; gives a fitting use such as fixed records, coordinates, or dictionary keys; the example is valid Python and actually uses a tuple.
  answer: |
    In Python, you would use a tuple instead of a list when you need an immutable collection of items, meaning that the order and contents cannot be changed after the tuple is created. Here's a short example:

    ```python
    coordinates = (10.5, 20.75)
    ```

    In this case, trying to modify the tuple will result in an error:

    ```python
    # This will raise an error because tuples are immutable.
    # coordinates[1] = 30.0
    ```

    This example demonstrates the immutability of tuples, which can be useful in situations where you want to ensure that the data remains constant after initialization.
  pass: true
  score: 4
  note: immutable, coordinates, valid example; doesn't say lists can change
