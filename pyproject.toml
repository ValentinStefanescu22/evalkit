[project]
name = "evalkit"
version = "0.1.0"
description = "LLM evaluation and prompt-injection test harness"
readme = "README.md"
authors = [
    { name = "ValentinStefanescu22", email = "valentin.stefanescu04@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "typer>=0.27.3",
]

[project.scripts]
evalkit = "evalkit.cli:app"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "types-jsonschema>=4.26.0.20261006",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
